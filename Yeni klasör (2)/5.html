<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>5. Sınıf Sosyal Bilgiler Oyunu</title>
<link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
<style>
body {
    font-family: 'MedievalSharp', cursive;
    background-image: url('images/background.jpg');
    background-size: cover;
    background-position: center;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    color: #4b2e0f;
}

.game-container {
    width: 80%;
    max-width: 900px;
    background-color: rgba(255, 248, 220, 0.95);
    border: 3px solid #8b4513;
    border-radius: 15px;
    padding: 20px;
    box-shadow: 5px 5px 20px rgba(0,0,0,0.4);
    text-align: center;
}

h1 {
    font-size: 28px;
    color: #8b4513;
    text-shadow: 2px 2px 4px #fff;
    margin-bottom: 15px;
}

.progress-bar {
    width: 100%;
    background-color: #dcdcdc;
    border-radius: 5px;
    overflow: hidden;
    height: 15px;
    margin-bottom: 15px;
}

.progress {
    height: 15px;
    width: 0%;
    background-color: #8b4513;
    transition: width 0.3s;
}

.question-box, .matching-box {
    background-color: rgba(255, 248, 220, 0.95);
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 15px;
    font-size: 16px;
}

.option {
    display: block;
    background-color: #8b4513;
    color: white;
    padding: 12px;
    margin: 10px auto;
    width: 60%;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    transition: background-color 0.3s;
}

.option:hover {
    background-color: #a0522d;
}

.match-container {
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    margin-bottom: 10px;
}

.match-item {
    display: inline-block;
    background-color: #8b4513;
    color: white;
    padding: 10px;
    margin: 5px;
    border-radius: 5px;
    cursor: grab;
    user-select: none;
}

.drop-target {
    display: inline-block;
    background-color: #d2b48c;
    color: black;
    padding: 10px;
    margin: 5px;
    min-width: 120px;
    min-height: 40px;
    border-radius: 5px;
    vertical-align: top;
}

#score {
    font-size: 20px;
    font-weight: bold;
}

#final-screen {
    display:none;
    background:#fff8dc;
    padding:20px;
    border:3px solid #8b4513;
    border-radius:10px;
    opacity:0;
    transition: opacity 1s;
}
</style>
</head>
<body>

<div class="game-container">
    <h1>5. Sınıf Sosyal Bilgiler</h1>

    <div class="progress-bar">
        <div class="progress" id="progress"></div>
    </div>

    <!-- Soru-Cevap Bölümü -->
    <div class="question-box" id="question-box">
        <p id="question">Soru yükleniyor...</p>
        <button class="option" id="option0"></button>
        <button class="option" id="option1"></button>
        <button class="option" id="option2"></button>
        <button class="option" id="option3"></button>
    </div>

    <!-- Sürükle-Bırak Eşleştirme -->
    <div class="matching-box" id="matching-box">
        <p>Tarihi olayları doğru yılların üzerine sürükleyin:</p>
        <div id="events" class="match-container"></div>
        <div id="years" class="match-container"></div>
        <button id="check-match">Kontrol Et</button>
    </div>

    <!-- Final Ekranı -->
    <div id="final-screen">
        <h2>Tebrikler!</h2>
        <p id="final-score"></p>
        <button onclick="restartGame()">Tekrar Oyna</button>
    </div>

    <p id="score">Puan: 0</p>

    <audio id="correct-sound" src="sounds/correct.mp3"></audio>
    <audio id="wrong-sound" src="sounds/wrong.mp3"></audio>
    <audio id="next-sound" src="sounds/next.mp3"></audio>
    <audio id="final-sound" src="sounds/final.mp3"></audio>
</div>

<script>
// --- Soru-Cevap Verisi ---
const questions = [
    {question:"Türkiye'nin başkenti neresidir?", options:["İstanbul","Ankara","İzmir","Bursa"], answer:1},
    {question:"Çanakkale Savaşı hangi yılda oldu?", options:["1915","1923","1938","1912"], answer:0},
    {question:"Türkiye'nin en uzun nehri hangisidir?", options:["Fırat","Kızılırmak","Dicle","Sakarya"], answer:1},
    {question:"Mevlana hangi şehirde yaşamıştır?", options:["Konya","Bursa","Trabzon","Antalya"], answer:0},
    {question:"Atatürk'ün doğum yılı nedir?", options:["1881","1876","1890","1885"], answer:0},
    {question:"İstanbul'un fethi hangi yılda?", options:["1453","1402","1492","1517"], answer:0},
    {question:"Cumhuriyet hangi yılda ilan edildi?", options:["1923","1919","1920","1925"], answer:0},
    {question:"Türkiye'nin en büyük gölü hangisidir?", options:["Tuz Gölü","Van Gölü","Beyşehir Gölü","Eğirdir Gölü"], answer:1},
    {question:"İlk Osmanlı padişahı kimdir?", options:["Orhan Gazi","Osman Gazi","Yavuz Sultan Selim","Süleyman"], answer:1},
    {question:"Mehmet Akif Ersoy hangi eseri yazdı?", options:["İstiklal Marşı","Safahat","Mesnevi","Kutadgu Bilig"], answer:0}
];

let currentQuestion = 0;
let score = 0;

// --- Eşleştirme Verisi ---
const matches = [
    {event:"İstanbul'un Fethi", year:"1453"},
    {event:"Cumhuriyetin İlanı", year:"1923"},
    {event:"Çanakkale Savaşı", year:"1915"},
    {event:"Atatürk'ün Doğumu", year:"1881"}
];

// --- Soru-Cevap Fonksiyonları ---
function loadQuestion(){
    if(currentQuestion < questions.length){
        const q = questions[currentQuestion];
        document.getElementById("question").innerText = q.question;
        q.options.forEach((opt,i)=>{
            const btn = document.getElementById("option"+i);
            btn.innerText = opt;
            btn.onclick = ()=>checkAnswer(i);
        });
        document.getElementById("progress").style.width = ((currentQuestion)/questions.length*50) + "%";
        document.getElementById("question-box").style.display="block";
        document.getElementById("matching-box").style.display="none";
    } else {
        startMatching();
    }
}

function checkAnswer(selected){
    if(selected === questions[currentQuestion].answer){
        score += 10;
        playSound('correct-sound');
        showMessage("Doğru!", true);
    } else {
        playSound('wrong-sound');
        showMessage("Yanlış!", false);
    }
    document.getElementById("score").innerText = "Puan: "+score;
    currentQuestion++;
    // Next sesi ve sonraki soru
    setTimeout(()=>{
        playSound('next-sound');
        loadQuestion();
    }, 500);
}

function playSound(id){
    const audio = document.getElementById(id);
    audio.currentTime = 0;
    audio.play().catch(()=>console.log("Ses oynatma izni yok"));
}

function showMessage(msg, success){
    const msgDiv = document.createElement("div");
    msgDiv.innerText = msg;
    msgDiv.style.background = success?"#90ee90":"#ff6347";
    msgDiv.style.padding = "10px";
    msgDiv.style.margin = "10px 0";
    msgDiv.style.borderRadius = "5px";
    document.querySelector(".game-container").insertBefore(msgDiv, document.getElementById("score"));
    setTimeout(()=>msgDiv.remove(),1000);
}

// --- Sürükle-Bırak Eşleştirme ---
function startMatching(){
    document.getElementById("question-box").style.display="none";
    document.getElementById("matching-box").style.display="block";
    const eventsDiv = document.getElementById("events");
    const yearsDiv = document.getElementById("years");
    eventsDiv.innerHTML="";
    yearsDiv.innerHTML="";

    const shuffledEvents = [...matches].sort(()=>0.5-Math.random());
    const shuffledYears = [...matches].sort(()=>0.5-Math.random());

    shuffledEvents.forEach((m,i)=>{
        const div = document.createElement("div");
        div.className="match-item";
        div.draggable=true;
        div.innerText=m.event;
        div.addEventListener("dragstart", e=>{e.dataTransfer.setData("text",m.event)});
        eventsDiv.appendChild(div);
    });

    shuffledYears.forEach((m,i)=>{
        const div = document.createElement("div");
        div.className="drop-target";
        div.dataset.correct = m.event;
        div.innerText = m.year;
        div.addEventListener("dragover", e=>e.preventDefault());
        div.addEventListener("drop", e=>{
            e.preventDefault();
            const dragged = e.dataTransfer.getData("text");
            div.dataset.chosen = dragged;
            div.style.backgroundColor="#90ee90";
        });
        yearsDiv.appendChild(div);
    });
}

// --- Kontrol ---
document.getElementById("check-match").onclick = ()=>{
    const targets=document.querySelectorAll(".drop-target");
    let correct=0;
    targets.forEach(t=>{
        if(t.dataset.chosen === t.dataset.correct){
            correct++;
            t.style.backgroundColor="#32cd32";
        } else {
            t.style.backgroundColor="#ff6347";
        }
    });
    if(correct === matches.length){
        score += 20;
        // Next sesi çal ve sonra final ekran
        playSound('next-sound');
        setTimeout(showFinalScreen, 500);
    } else {
        playSound('wrong-sound');
        showMessage("Bazı eşleşmeler yanlış.", false);
    }
    document.getElementById("score").innerText="Puan: "+score;
    document.getElementById("progress").style.width="100%";
}

// --- Final Ekranı ---
function showFinalScreen(){
    document.getElementById("question-box").style.display="none";
    document.getElementById("matching-box").style.display="none";

    const finalScreen = document.getElementById("final-screen");
    document.getElementById("final-score").innerText = "Toplam puanınız: "+score;
    finalScreen.style.display="block";

    // Fade-in animasyonu
    setTimeout(()=>finalScreen.style.opacity="1", 50);

    // Final ses efekti
    playSound('final-sound');
}

function restartGame(){
    score=0;
    currentQuestion=0;
    document.getElementById("score").innerText="Puan: 0";
    document.getElementById("progress").style.width="0%";
    document.getElementById("final-screen").style.display="none";
    document.getElementById("final-screen").style.opacity="0";
    loadQuestion();
}

loadQuestion();
</script>
</body>
</html>
